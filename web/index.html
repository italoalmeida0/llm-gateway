<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Self-hosted LLM API gateway with a personal dashboard and an Indirect Code agent workspace." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111315" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LLM Gateway" />
    <!-- PWA install surface (injected into dist/index.html post-build: Bun's
      HTML bundler tries to resolve link hrefs as build inputs) -->
    <!--PWA-HEAD-->
    <title>LLM Gateway</title>
    <script>
      // Theme init (before first paint): stored choice wins, otherwise follow
      // the OS. Sets data-theme + no FOUC. Also keeps the favicon in sync with
      // the theme (dark tile on light theme, light tile on dark) — including
      // runtime toggles, via a MutationObserver on data-theme.
      (function () {
        try {
          var t = localStorage.getItem("llmgw-theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
        function iconFor(t) {
          var tile = t === "dark" ? "%23f2f2f5" : "%231c1c1e";
          var glyph = t === "dark" ? "%231c1c1e" : "%23f5f6f8";
          return (
            "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E" +
            "%3Crect width='32' height='32' rx='8' fill='" + tile + "'/%3E" +
            "%3Cpath d='M16 7l7 4v8l-7 4-7-4v-8z' fill='none' stroke='" + glyph + "' stroke-width='2'/%3E" +
            "%3Ccircle cx='16' cy='15' r='2.5' fill='" + glyph + "'/%3E%3C/svg%3E"
          );
        }
        function syncFavicon() {
          var t = document.documentElement.dataset.theme === "dark" ? "dark" : "light";
          // Deduplicate: only one icon link may exist (browsers pin the
          // first and ignore the rest, so a stray duplicate freezes the icon).
          var links = document.querySelectorAll("link[rel='icon']");
          var link = links[0];
          for (var i = 1; i < links.length; i++) {
            if (links[i].parentNode) links[i].parentNode.removeChild(links[i]);
          }
          if (!link) {
            link = document.createElement("link");
            link.rel = "icon";
            document.head.appendChild(link);
          }
          // Per-page override (set by the SPA, e.g. Indirect Code icon).
          // Cleared when leaving the page: falls back to the gateway tile.
          if (window.__pageIcon) {
            if (link.getAttribute("href") !== window.__pageIcon) link.href = window.__pageIcon;
            return;
          }
          link.href = iconFor(t);
        }
        syncFavicon();
        // Theme-color for the browser chrome / installed-app switcher.
        // Static media-based tags cover first paint; this keeps the value
        // in sync with the effective theme at runtime (same pattern as
        // tweakgrid's theme subscriber).
        function syncThemeColor() {
          var t = document.documentElement.dataset.theme === "dark" ? "dark" : "light";
          var content = t === "dark" ? "#111315" : "#ffffff";
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          // Collapse the static light/dark pair into a single live tag.
          var meta = metas[0];
          for (var i = 1; i < metas.length; i++) {
            if (metas[i].parentNode) metas[i].parentNode.removeChild(metas[i]);
          }
          if (!meta) {
            meta = document.createElement("meta");
            meta.name = "theme-color";
            document.head.appendChild(meta);
          }
          meta.removeAttribute("media");
          if (meta.getAttribute("content") !== content) meta.setAttribute("content", content);
        }
        syncThemeColor();
        // Exposed for the SPA per-page override (window.__pageIcon).
        window.__syncFavicon = syncFavicon;
        window.__syncThemeColor = syncThemeColor;
        new MutationObserver(function () {
          syncFavicon();
          syncThemeColor();
        }).observe(document.documentElement, {
          attributes: true,
          attributeFilter: ["data-theme"],
        });
      })();
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231c1c1e'/%3E%3Cpath d='M16 7l7 4v8l-7 4-7-4v-8z' fill='none' stroke='%23f5f6f8' stroke-width='2'/%3E%3Ccircle cx='16' cy='15' r='2.5' fill='%23f5f6f8'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./style.tailwindcss.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/index.tsx"></script>
  </body>
</html>

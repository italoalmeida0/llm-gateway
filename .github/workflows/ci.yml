name: CI

# Cross-platform CI for llm-gateway:
#   - gateway: Bun-side gates on Linux only (lint, typecheck, unit+integration
#     tests, SPA build sanity).
#   - daemon: Go gates on Linux, macOS AND Windows — the daemon/launcher ship
#     per-platform (killslot/spawn/pidalive/process-stop have OS variants), so
#     every PR runs the full suite on every OS we release for. fail-fast is off:
#     we want the FULL matrix verdict, not the first failure.
#   - daemon-race: the complete race detector on Linux.
on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gateway:
    name: Gateway (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - uses: actions/setup-go@v5
        with:
          go-version-file: indirect-code-daemon/go.mod
          cache-dependency-path: indirect-code-daemon/go.sum

      - name: Build daemon for integration tests
        run: bun run build:daemon

      - name: Unit + integration tests
        run: bun test

      - name: SPA build sanity
        run: bun run build:web

  daemon:
    name: Daemon (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: indirect-code-daemon
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: indirect-code-daemon/go.mod
          cache-dependency-path: indirect-code-daemon/go.sum

      # Source pin makes shell behavior reproducible and avoids release API limits.
      - uses: actions/checkout@v4
        with:
          repository: italoalmeida0/unish
          ref: 82da4f40f8f9100325a7593e40013757ca1ed7aa
          path: tmp/unish
          persist-credentials: false

      - name: Build unish for native tool tests
        working-directory: tmp/unish
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p "$RUNNER_TEMP/unish-bin"
          shell_binary=unish
          if [ "$RUNNER_OS" = "Windows" ]; then shell_binary=unish.exe; fi
          go build -mod=vendor -trimpath -o "$RUNNER_TEMP/unish-bin/$shell_binary" .
          echo "$RUNNER_TEMP/unish-bin" >> "$GITHUB_PATH"
          echo "UNISH_TEST_BINARY=$RUNNER_TEMP/unish-bin/$shell_binary" >> "$GITHUB_ENV"

      - name: Vet
        run: go vet ./...

      - name: Build (native)
        run: go build ./...

      - name: Tests
        run: go test ./... -count=1 -timeout 900s

  daemon-race:
    name: Daemon race (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: indirect-code-daemon
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: indirect-code-daemon/go.mod
          cache-dependency-path: indirect-code-daemon/go.sum

      - name: Tests (race detector, full)
        run: go test -race -count=1 ./... -timeout 1200s
